paths:
  raw_csv: "../archive-2/DataCoSupplyChainDataset.csv"
  interim_dir: "data/interim"
  processed_dir: "data/processed"
  reports_dir: "reports"

data:
  encoding: "latin-1"
  order_date_column: "order date (DateOrders)"
  ship_date_column: "shipping date (DateOrders)"
  quantity_column: "Order Item Quantity"
  excluded_order_statuses:
    - "CANCELED"
    - "SUSPECTED_FRAUD"
  clean_window_end: "2017-10-01"
  planning_unit: "Product Name"

audit:
  quantity_collapse_threshold: 0.95
  leadtime_uniformity_alpha: 0.01
  min_rows_for_mode_test: 500

demand:
  frequency: "W"
  min_weeks_covered: 100
  core_min_weeks_covered: 144

segmentation:
  abc_thresholds: [0.80, 0.95]
  xyz_thresholds: [0.25, 0.50]
  service_levels:
    A: 0.98
    B: 0.95
    C: 0.90

costs:
  annual_holding_rate: 0.25
  ordering_cost_per_order: 250.0
  unit_cost_as_share_of_price: 0.65
  weeks_per_year: 52

leadtime:
  proxy_mode: "Standard Class"
  sensitivity_multipliers: [0.0, 0.25, 0.5, 0.75, 1.0, 1.25, 1.5, 2.0]

policy:
  time_base: "day"
  bootstrap_draws: 20000
  bootstrap_seed: 42
  service_level_sweep: [0.80, 0.85, 0.90, 0.925, 0.95, 0.96, 0.97, 0.98, 0.99, 0.995, 0.999]
  representative_segments: ["AX", "CZ"]

backtest:
  test_weeks: 40
  baseline_safety_stock_pct_of_mean_demand: 0.50
  warmup_days: 30
  leadtime_seed: 7
  unmet_demand: "lost"
